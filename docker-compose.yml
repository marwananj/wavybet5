services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wavybet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavybet}
      POSTGRES_DB: wavybet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavybet"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wavybet:${POSTGRES_PASSWORD:-wavybet}@db:5432/wavybet
    ports:
      - "4000:4000"

volumes:
  pgdata:
